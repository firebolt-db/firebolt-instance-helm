apiVersion: v1
kind: Pod
metadata:
  name: {{ include "fbinstance.fullname" . }}-test-postgres
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  {{- if .Values.postgresql.tls.enabled }}
  volumes:
    - name: postgres-ca
      secret:
        secretName: {{ .Values.postgresql.tls.caSecret }}
        items:
          - key: {{ .Values.postgresql.tls.caKey }}
            path: ca.crt
  {{- end }}
  containers:
    - name: check
      image: {{ .Values.postgresql.image }}
      env:
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: {{ include "fbinstance.postgresSecretName" . }}
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "fbinstance.postgresSecretName" . }}
              key: password
        - name: PGDATABASE
          value: {{ .Values.postgresql.database | quote }}
        {{- if .Values.postgresql.tls.enabled }}
        - name: PGSSLMODE
          value: verify-full
        - name: PGSSLROOTCERT
          value: /trust/ca.crt
      volumeMounts:
        - name: postgres-ca
          mountPath: /trust
          readOnly: true
        {{- end }}
      command:
        - sh
        - -c
        - |
          set -e
          {{- include "fbinstance.testShellHelpers" . | nindent 10 }}
          {{- if .Values.postgresql.local_enabled }}
          HOST="{{ include "fbinstance.fullname" . }}-metadata-pg.{{ .Release.Namespace }}.svc.cluster.local"
          {{- else }}
          HOST={{ .Values.postgresql.host | quote }}
          {{- end }}
          export PGPORT={{ .Values.postgresql.port }}
          log "PostgreSQL readiness (pg_isready $HOST:$PGPORT)"
          pg_isready -h "$HOST" -p "$PGPORT" -U {{ .Values.postgresql.username }} -d {{ .Values.postgresql.database }} \
            || fail "PostgreSQL not ready"
          pass "PostgreSQL is accepting connections"
          RESULT=$(psql -h "$HOST" -p "$PGPORT" -At -v ON_ERROR_STOP=1 -c "SELECT 1")
          [ "$RESULT" = "1" ] || fail "credential Secret could not execute SELECT 1"
          pass "configured credentials authenticate to PostgreSQL"
