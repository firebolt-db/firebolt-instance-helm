{{- if .Values.postgresql.local_enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "fbinstance.fullname" . }}-test-postgres
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: check
      image: {{ .Values.postgresql.image }}
      env:
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: {{ include "fbinstance.postgresSecretName" . }}
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "fbinstance.postgresSecretName" . }}
              key: password
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              name: {{ include "fbinstance.postgresSecretName" . }}
              key: database
      command:
        - sh
        - -c
        - |
          set -e
          {{- include "fbinstance.testShellHelpers" . | nindent 10 }}
          HOST="{{ include "fbinstance.fullname" . }}-metadata-pg.{{ .Release.Namespace }}.svc.cluster.local"
          log "PostgreSQL readiness (pg_isready $HOST:5432)"
          pg_isready -h "$HOST" -p 5432 -U {{ .Values.postgresql.username }} -d {{ .Values.postgresql.database }} \
            || fail "PostgreSQL not ready"
          pass "PostgreSQL is accepting connections"
          RESULT=$(psql -h "$HOST" -p 5432 -At -v ON_ERROR_STOP=1 -c "SELECT 1")
          [ "$RESULT" = "1" ] || fail "credential Secret could not execute SELECT 1"
          pass "configured credentials authenticate to PostgreSQL"
{{- end }}
