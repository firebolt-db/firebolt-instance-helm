{{- $pgSecretName := include "fbinstance.postgresSecretName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fbinstance.fullname" . }}-metadata-service
  namespace: {{ .Release.Namespace }}
  {{- with .Values.metadata.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "fbinstance.labels" . | nindent 4 }}
    firebolt/component: metadata-service
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "fbinstance.selectorLabels" . | nindent 6 }}
      firebolt/component: metadata-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      annotations:
        checksum/config: {{ (include (print $.Template.BasePath "/metadata-service-configmap.yaml") . | fromYaml).data | toYaml | sha256sum }}
        checksum/secret: {{ toYaml .Values.postgresql | sha256sum }}
        {{- if .Values.postgresql.tls.enabled }}
        checksum/postgres-ca-version: {{ (lookup "v1" "Secret" .Release.Namespace .Values.postgresql.tls.caSecret).metadata | default dict | dig "resourceVersion" "" | sha256sum }}
        {{- end }}
        {{- if .Values.postgresql.credentials.existingSecret }}
        checksum/credentials-version: {{ (lookup "v1" "Secret" .Release.Namespace $pgSecretName).metadata | default dict | dig "resourceVersion" "" | sha256sum }}
        {{- end }}
        {{- with .Values.metadata.podTemplate.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "fbinstance.podLabels" . | nindent 8 }}
        firebolt/component: metadata-service
        {{- with .Values.metadata.podTemplate.extraPodLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # See the equivalent comment in engine-statefulset.yaml: kill legacy
      # service-link env injection. Pensieve is a Quarkus app and maps env
      # vars to MicroProfile config keys, so the auto-injected vars are
      # actively dangerous here (cf. floci's FLOCI_PORT collision).
      enableServiceLinks: false
      # Pensieve never calls the Kubernetes API.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.metadata.deployment.terminationGracePeriodSeconds }}
      securityContext:
        {{- if .Values.metadata.podTemplate.podSecurityContext }}
        {{- toYaml .Values.metadata.podTemplate.podSecurityContext | nindent 8 }}
        {{- else }}
        runAsNonRoot: true
        runAsUser: 1111
        runAsGroup: 1111
        seccompProfile:
          type: RuntimeDefault
        {{- end }}
      {{- with .Values.metadata.podTemplate.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with .Values.metadata.podTemplate.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metadata.podTemplate.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metadata.podTemplate.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metadata.podTemplate.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metadata.podTemplate.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with (concat .Values.imagePullSecrets .Values.metadata.podTemplate.imagePullSecrets) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metadata.podTemplate.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: metadata-service
          image: "{{ .Values.metadata.image.repository }}:{{ default .Chart.AppVersion .Values.metadata.image.tag }}"
          imagePullPolicy: {{ .Values.metadata.image.pullPolicy }}
          command: ["/dedicated-pensieve", "--config", "/configs/config.yaml"]
          ports:
            - name: grpc
              containerPort: {{ .Values.metadata.server.port }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 2
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: {{ .Values.metadata.server.port }}
              service: ""
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /configs
              readOnly: true
            - name: postgres-creds
              mountPath: {{ .Values.postgresql.credentials.mountPath }}
              readOnly: true
            {{- if .Values.postgresql.tls.enabled }}
            - name: postgres-ca
              mountPath: /secrets/postgres-ca
              readOnly: true
            {{- end }}
            # Scratch space outside the read-only root filesystem.
            - name: tmp
              mountPath: /tmp
          {{- with .Values.metadata.podTemplate.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.metadata.resources | nindent 12 }}
          securityContext:
            {{- if .Values.metadata.podTemplate.securityContext }}
            {{- toYaml .Values.metadata.podTemplate.securityContext | nindent 12 }}
            {{- else }}
            runAsNonRoot: true
            runAsUser: 1111
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            {{- end }}
          {{- with .Values.metadata.podTemplate.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: POSTGRES_USERNAME_FILE
              value: {{ .Values.postgresql.credentials.mountPath }}/username
            - name: POSTGRES_PASSWORD_FILE
              value: {{ .Values.postgresql.credentials.mountPath }}/password
            {{- if .Values.postgresql.tls.enabled }}
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /secrets/postgres-ca/ca.crt
            {{- end }}
          {{- with .Values.metadata.podTemplate.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.metadata.podTemplate.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- with .Values.metadata.podTemplate.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "fbinstance.fullname" . }}-metadata-service
        - name: postgres-creds
          secret:
            secretName: {{ $pgSecretName }}
        {{- if .Values.postgresql.tls.enabled }}
        - name: postgres-ca
          secret:
            secretName: {{ .Values.postgresql.tls.caSecret }}
            items:
              - key: {{ .Values.postgresql.tls.caKey }}
                path: ca.crt
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.metadata.podTemplate.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
