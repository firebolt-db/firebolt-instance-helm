{{- $needsManaged := false -}}
{{- range $engine := .Values.engines -}}
{{- $effective := include "fbinstance.effectiveEngine" (dict "root" $ "engine" $engine) | fromYaml -}}
{{- if empty $effective.serviceAccount -}}{{- $needsManaged = true -}}{{- end -}}
{{- end -}}
{{- if $needsManaged }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fbinstance.fullname" . }}-engine
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fbinstance.labels" . | nindent 4 }}
    firebolt/component: engine
# Engine pods do not call the Kubernetes API. Suppressing the token
# mount means a code-execution exploit inside the engine cannot use a
# projected SA token to talk to the apiserver at all, even if the SA
# accumulates accidental RBAC later. Engine pods also disable automounting
# explicitly, including when they use a supplied ServiceAccount.
#
# Rendered when any Engine uses the managed ServiceAccount.
automountServiceAccountToken: false
{{- end }}
